name: Build Electron + FastAPI Windows App

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Python backend (uv + PyInstaller)
      # -----------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Install PyInstaller
        working-directory: backend
        run: uv add pyinstaller

      - name: Build FastAPI backend.exe
        working-directory: backend
        run: uv run pyinstaller --onefile app/main.py --name fastapi-backend

      - name: Copy backend.exe into Electron app
        run: copy backend\dist\fastapi-backend.exe frontend\resources\fastapi-backend.exe

      # -----------------------------
      # Setup Electron frontend (Node.js + Vite + electron-builder)
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm install

      - name: Build Electron Windows installer
        working-directory: frontend
        run: npm run build

      # -----------------------------
      # Upload build artifacts
      # -----------------------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-build
          path: |
            frontend/dist/*.exe
            frontend/dist/*.msi

      # -----------------------------
      # Auto Release (if push tag)
      # -----------------------------
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/dist/*.exe
            frontend/dist/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
