name: Build Electron + FastAPI Windows App

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 后端
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Install PyInstaller
        working-directory: backend
        run: uv add pyinstaller

      - name: Build FastAPI backend.exe
        working-directory: backend
        run: uv run pyinstaller --onefile app/main.py --name fastapi-backend

      - name: Copy backend.exe into Electron app
        run: |
          mkdir -p frontend/resources
          cp backend/dist/fastapi-backend.exe frontend/resources/fastapi-backend.exe
      # 前端
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        working-directory: frontend/electron
        run: npm install

      - name: Build Electron Windows installer
        working-directory: frontend/electron
        run: npm run electron:build

      # 上传与发布
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-windows-build
          path: backend/dist/*.exe
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-build
          path: frontend/release/*.exe
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-unpacked-build
          path: frontend/release/win-unpacked/*.exe
